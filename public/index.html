<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PO CSV Builder</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f4f6fa;
      }
      body { margin: 0; }
      main { max-width: 980px; margin: 36px auto; padding: 0 20px; }
      section {
        margin: 20px 0;
        padding: 24px;
        border: 1px solid #dfe4ec;
        border-radius: 12px;
        background: white;
      }
      h1 { margin-bottom: 8px; }
      h2 { margin-top: 0; font-size: 1.15rem; }
      p, .hint { color: #536078; }
      .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
      label { display: block; font-weight: 600; }
      input, select {
        box-sizing: border-box;
        width: 100%;
        margin-top: 7px;
        padding: 10px;
        border: 1px solid #b8c2d2;
        border-radius: 6px;
        background: white;
        font: inherit;
      }
      button {
        margin-top: 18px;
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #175cd3;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 1.5em; }
      #status.error { color: #b42318; }
      #mappings { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 9px; border: 1px solid #dfe4ec; text-align: left; }
      th { background: #f4f6fa; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>PO CSV Builder</h1>
      <p>Map an emailed purchase order to your EasyEcom template and download the completed CSV.</p>

      <section>
        <h2>1. Upload your files</h2>
        <div class="fields">
          <label>PO file (CSV or XLSX)
            <input id="source-file" type="file" accept=".csv,.xlsx" required>
          </label>
          <label>EasyEcom template (CSV)
            <input id="template-file" type="file" accept=".csv" required>
          </label>
        </div>
        <button id="load-button" type="button">Read files</button>
      </section>

      <section id="mapping-section" hidden>
        <h2>2. Map template fields</h2>
        <p id="row-count" class="hint"></p>
        <div id="mappings"></div>
        <label style="max-width: 480px; margin-top: 20px;">EasyEcom vendor token
          <input id="vendor-token" type="password" autocomplete="off">
        </label>
        <button id="build-button" type="button">Build CSV</button>
      </section>

      <section id="result-section" hidden>
        <h2>3. Review and download</h2>
        <p id="preview-count" class="hint"></p>
        <div class="table-wrap"><table id="preview-table"></table></div>
        <button id="download-button" type="button">Download completed CSV</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      const sourceInput = document.getElementById("source-file");
      const templateInput = document.getElementById("template-file");
      const loadButton = document.getElementById("load-button");
      const buildButton = document.getElementById("build-button");
      const downloadButton = document.getElementById("download-button");
      const mappingSection = document.getElementById("mapping-section");
      const resultSection = document.getElementById("result-section");
      const mappingContainer = document.getElementById("mappings");
      const status = document.getElementById("status");
      let output = null;

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.classList.toggle("error", isError);
      }

      function uploadFiles() {
        const data = new FormData();
        data.append("source_file", sourceInput.files[0]);
        data.append("template_file", templateInput.files[0]);
        return data;
      }

      async function responseData(response) {
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "The request failed.");
        return data;
      }

      function addMappings(data) {
        mappingContainer.replaceChildren();
        data.template_headers.forEach((header, index) => {
          const label = document.createElement("label");
          label.textContent = `Template field: ${header}`;
          const select = document.createElement("select");
          select.dataset.column = String(index);

          const options = [["blank", "Leave blank"]];
          data.source_headers.forEach((sourceHeader, sourceIndex) => {
            options.push([`source:${sourceIndex}`, `Source: ${sourceHeader}`]);
          });
          options.push(["vendor_token", "Vendor token"], ["unit_price", "Unit price (10)"]);
          options.forEach(([value, text]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = text;
            select.append(option);
          });
          select.value = data.suggested_mappings[index];
          label.append(select);
          mappingContainer.append(label);
        });
      }

      loadButton.addEventListener("click", async () => {
        if (!sourceInput.files[0] || !templateInput.files[0]) {
          setStatus("Choose both files before continuing.", true);
          return;
        }
        loadButton.disabled = true;
        setStatus("Reading files…");
        resultSection.hidden = true;
        try {
          const response = await fetch("/api/preview", { method: "POST", body: uploadFiles() });
          const data = await responseData(response);
          addMappings(data);
          document.getElementById("row-count").textContent =
            `${data.row_count.toLocaleString()} PO rows will become ${data.row_count.toLocaleString()} output rows.`;
          mappingSection.hidden = false;
          setStatus("Files are ready. Check the suggested mappings.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          loadButton.disabled = false;
        }
      });

      buildButton.addEventListener("click", async () => {
        const token = document.getElementById("vendor-token").value;
        const mappings = Object.fromEntries(
          [...mappingContainer.querySelectorAll("select")].map(select =>
            [select.dataset.column, select.value])
        );
        const data = uploadFiles();
        data.append("vendor_token", token);
        data.append("mappings", JSON.stringify(mappings));
        buildButton.disabled = true;
        setStatus("Building your CSV…");
        try {
          const response = await fetch("/api/transform", { method: "POST", body: data });
          output = await responseData(response);
          const table = document.getElementById("preview-table");
          table.replaceChildren();
          const head = document.createElement("thead");
          const headerRow = document.createElement("tr");
          output.headers.forEach(value => {
            const cell = document.createElement("th");
            cell.textContent = value;
            headerRow.append(cell);
          });
          head.append(headerRow);
          table.append(head);
          const body = document.createElement("tbody");
          output.preview.forEach(row => {
            const rowElement = document.createElement("tr");
            row.forEach(value => {
              const cell = document.createElement("td");
              cell.textContent = value;
              rowElement.append(cell);
            });
            body.append(rowElement);
          });
          table.append(body);
          document.getElementById("preview-count").textContent =
            `Showing ${Math.min(20, output.row_count).toLocaleString()} of ${output.row_count.toLocaleString()} output rows.`;
          resultSection.hidden = false;
          setStatus("Your file is ready to download.");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          buildButton.disabled = false;
        }
      });

      downloadButton.addEventListener("click", () => {
        if (!output) return;
        const url = URL.createObjectURL(
          new Blob([output.output_csv], { type: "text/csv;charset=utf-8" })
        );
        const link = document.createElement("a");
        link.href = url;
        link.download = output.filename;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      });

      [sourceInput, templateInput].forEach(input => {
        input.addEventListener("change", () => {
          mappingSection.hidden = true;
          resultSection.hidden = true;
          output = null;
          setStatus("");
        });
      });
    </script>
  </body>
</html>
